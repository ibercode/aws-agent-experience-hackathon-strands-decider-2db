[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearance-gap"
version = "0.1.0"
license = "Apache-2.0"
description = "An experimental Air Traffic Controller Assistant with Strands Decider 2B and Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.9,<3", "boto3>=1.35,<2", "strands-agents>=1,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["clearance_gap"]
